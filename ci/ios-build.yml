name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Secrets が未登録でも、コンパイルが通るかだけは毎回確かめる。
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 計算ロジックの自己点検
        run: python3 scripts/verify-logic.py

      - name: XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build (simulator / unsigned)
        run: |
          xcodebuild build \
            -project LiveValueCamera.xcodeproj \
            -scheme LiveValueCamera \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  # 計算ロジック（明度・座標変換・フィルタ）の単体テスト。配信の妨げにはしない。
  test:
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Test (simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];ids=[x['udid'] for rt in d.values() for x in rt if x.get('isAvailable')];print(ids[0] if ids else '')")
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project LiveValueCamera.xcodeproj \
            -scheme LiveValueCamera \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  testflight:
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Secrets の有無を確認
        id: check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "${KEY_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect の Secrets が未登録のため、TestFlight 配信はスキップしました（ビルド検証は上の build ジョブで完了しています）。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive & Upload
        if: steps.check.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/ci-testflight.sh
